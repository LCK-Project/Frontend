<!DOCTYPE html>
<html lang="ko">
<head>
<script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
  <script src="config.js"></script>
  <script src="assets/graph-utils.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LCK Knowledge Graph Dashboard</title>
  <!-- 파비콘 파일이 없어 생기는 404 콘솔 에러를 막는다. -->
  <link rel="icon" href="data:," />

  <style>
    * {
      box-sizing: border-box;
      font-family: "Pretendard", "Noto Sans KR", Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f6f7fb;
      color: #222;
    }

    header {
      padding: 22px 36px;
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 800;
    }

    header span {
      color: #6b7280;
      font-size: 14px;
    }

    .container {
      display: grid;
      grid-template-columns: 300px minmax(0, 1fr) 380px;
      gap: 20px;
      padding: 24px;
      height: calc(100vh - 82px);
    }

    .panel {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04);
      overflow: auto;
      min-width: 0;
    }

    .panel h2 {
      margin-top: 0;
      font-size: 18px;
      margin-bottom: 16px;
    }

    textarea {
      width: 100%;
      height: 110px;
      resize: none;
      border: 1px solid #d1d5db;
      border-radius: 14px;
      padding: 14px;
      font-size: 14px;
      outline: none;
    }

    textarea:focus {
      border-color: #f59e0b;
      box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.18);
    }

    button {
      border: none;
      cursor: pointer;
      border-radius: 12px;
      font-weight: 700;
      transition: 0.2s;
    }

    .ask-btn {
      width: 100%;
      margin-top: 12px;
      padding: 14px;
      background: #f59e0b;
      color: white;
      font-size: 15px;
    }

    .ask-btn:hover {
      background: #d97706;
    }

    .suggestions {
      margin-top: 22px;
    }

    .suggestions button {
      width: 100%;
      text-align: left;
      padding: 12px;
      margin-bottom: 10px;
      background: #fff7ed;
      color: #92400e;
      border: 1px solid #fed7aa;
    }

    .suggestions button:hover {
      background: #ffedd5;
    }

    .filters {
      margin-top: 24px;
    }

    select {
      width: 100%;
      padding: 11px;
      border-radius: 12px;
      border: 1px solid #d1d5db;
      margin-bottom: 10px;
      background: white;
    }

    .main-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .status {
      font-size: 13px;
      color: #6b7280;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }

    .stat-card {
      background: #fff7ed;
      border: 1px solid #fed7aa;
      border-radius: 14px;
      padding: 14px;
      min-width: 0;
    }

    .stat-card .label {
      color: #92400e;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .stat-card .value {
      font-size: 16px;
      font-weight: 800;
      color: #111827;
      line-height: 1.35;
      word-break: keep-all;
      overflow-wrap: break-word;
    }

    .graph-box {
      height: 430px;
      border-radius: 18px;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      overflow: hidden;
    }

    .graph-body {
      display: grid;
      grid-template-columns: 150px minmax(0, 1fr);
      gap: 12px;
      align-items: start;
    }

    .graph-main {
      min-width: 0;
    }

    .filter-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }

    .filter-chips:empty {
      display: none;
    }

    .chip {
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid #e5e7eb;
      background: #ffffff;
      color: #374151;
      font-size: 12px;
    }

    .chip:hover:not(:disabled) {
      background: #fff7ed;
    }

    .chip.active {
      background: #f59e0b;
      border-color: #f59e0b;
      color: #ffffff;
    }

    .chip:disabled {
      color: #c4c9d1;
      cursor: default;
    }

    .chip-count {
      margin-left: 4px;
      font-size: 11px;
      font-weight: 400;
      opacity: 0.8;
    }

    .date-strip {
      margin-top: 10px;
      min-height: 56px;
    }

    #dateStrip {
      display: block;
      width: 100%;
    }

    #dateStrip circle {
      cursor: pointer;
    }

    #dateStrip text {
      font-size: 11px;
      fill: #6b7280;
    }

    .rail {
      min-width: 0;
      max-height: 560px;
      overflow-y: auto;
    }

    .rail-empty {
      color: #9ca3af;
      font-size: 13px;
      line-height: 1.5;
    }

    .rail-item {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      width: 100%;
      padding: 7px 6px;
      margin-bottom: 4px;
      background: transparent;
      border-radius: 10px;
      text-align: left;
      font-weight: 400;
      color: #111827;
    }

    .rail-item:hover,
    .rail-item:focus-visible {
      background: #fff7ed;
    }

    .rail-item.hidden {
      display: none;
    }

    .rail-item .dot {
      margin-top: 4px;
      flex: none;
    }

    .rail-text {
      min-width: 0;
    }

    .rail-name {
      display: block;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .rail-item .sub {
      display: block;
      font-size: 11px;
      color: #6b7280;
      margin-top: 2px;
    }

    .badge {
      display: inline-block;
      margin-left: 4px;
      padding: 1px 6px;
      border-radius: 999px;
      background: #f59e0b;
      color: #ffffff;
      font-size: 10px;
      font-weight: 700;
      vertical-align: 1px;
    }

    .rail-more {
      width: 100%;
      padding: 7px;
      background: #f3f4f6;
      color: #4b5563;
      font-size: 12px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }

    .answer-box {
      background: #fff7ed;
      border: 1px solid #fed7aa;
      border-radius: 16px;
      padding: 16px;
      line-height: 1.7;
      white-space: pre-wrap;
      min-height: 220px;
    }

    .chunk-card {
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 14px;
      margin-top: 12px;
      background: #fafafa;
      line-height: 1.6;
      font-size: 14px;
    }

    .chunk-card h4 {
      margin: 0 0 8px 0;
      color: #92400e;
    }

    .rdb-box {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 16px;
      padding: 16px;
      line-height: 1.7;
      white-space: pre-wrap;
      font-size: 14px;
    }

    .rdb-card {
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 10px 12px;
      margin-top: 10px;
      background: #f8fafc;
      font-size: 13px;
      line-height: 1.55;
    }

    .rdb-card strong {
      color: #1d4ed8;
    }

    .sql-box {
      margin-top: 12px;
      background: #0f172a;
      color: #e2e8f0;
      border-radius: 12px;
      padding: 12px;
      font-family: "Consolas", "Courier New", monospace;
      font-size: 12.5px;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .loading {
      color: #d97706;
      font-weight: 700;
    }

    .empty {
      color: #9ca3af;
    }

    @media (max-width: 1100px) {
      .container {
        grid-template-columns: 1fr;
        height: auto;
      }

      .stats {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>

<body>
  <header>
    <div>
      <h1>🎮 LCK Knowledge Graph Dashboard</h1>
      <span>Neo4j 지식그래프 기반 LCK 질의응답 시스템</span>
    </div>
    <span id="apiStatus">API 연결 대기</span>
  </header>

  <main class="container">
    <!-- 왼쪽 입력 패널 -->
    <section class="panel">
      <h2>자연어 질의</h2>

      <textarea id="question" placeholder="예: 젠지 우승 전략을 알려줘"></textarea>
      <button class="ask-btn" onclick="askQuestion()">질문하기</button>

      <div class="suggestions">
        <h2>추천 질문</h2>
        <button onclick="setQuestion('젠지 우승 전략을 알려줘')">젠지 우승 전략을 알려줘</button>
        <button onclick="setQuestion('페이커가 사용한 챔피언을 알려줘')">페이커가 사용한 챔피언을 알려줘</button>
        <button onclick="setQuestion('T1과 Gen.G의 관계를 알려줘')">T1과 Gen.G의 관계를 알려줘</button>
        <button onclick="setQuestion('2025 스프링 MVP 관련 내용을 알려줘')">2025 스프링 MVP 관련 내용을 알려줘</button>
      </div>

      <div class="filters">
        <h2>필터</h2>
        <select>
          <option>전체 기간</option>
          <option>2025</option>
          <option>2024</option>
        </select>

        <select>
          <option>전체 팀</option>
          <option>Gen.G</option>
          <option>T1</option>
          <option>HLE</option>
          <option>KT</option>
        </select>

        <select>
          <option>전체 분석 유형</option>
          <option>팀 분석</option>
          <option>선수 분석</option>
          <option>경기 분석</option>
          <option>대회 분석</option>
        </select>
      </div>
    </section>

    <!-- 가운데 대시보드 패널 -->
    <section class="panel">
      <div class="main-title">
        <h2>지식그래프 시각화</h2>
        <span class="status" id="queryStatus">질문을 입력하면 분석이 시작됩니다.</span>
      </div>

      <div class="stats">
        <div class="stat-card">
          <div class="label">핵심 분석 대상</div>
          <div class="value" id="statSeeds">-</div>
        </div>
        <div class="stat-card">
          <div class="label">관련 경기 · 관계</div>
          <div class="value" id="statMatches">-</div>
        </div>
        <div class="stat-card">
          <div class="label">분석 기간</div>
          <div class="value" id="statPeriod">-</div>
        </div>
        <div class="stat-card">
          <div class="label">참조 기사</div>
          <div class="value" id="statArticles">-</div>
        </div>
      </div>

      <div class="graph-body">
        <aside id="rail" class="rail">
          <div class="rail-empty">질문하면 엔티티가 여기에 표시됩니다.</div>
        </aside>
        <div class="graph-main">
          <div id="filterChips" class="filter-chips"></div>
          <div id="graph" class="graph-box"></div>
          <div class="date-strip">
            <svg id="dateStrip" height="56" role="img" aria-label="경기 날짜 스트립"></svg>
            <div id="dateStripEmpty" class="rail-empty" hidden>경기 노드가 없습니다</div>
          </div>
        </div>
      </div>
    </section>

    <!-- 오른쪽 답변 패널 -->
    <section class="panel">
      <h2>AI 답변 결과</h2>

      <div id="answer" class="answer-box empty">
        아직 질문이 입력되지 않았습니다.
      </div>

      <h2 style="margin-top: 24px;">지식그래프 근거</h2>
      <div id="chunks">
        <div class="chunk-card empty">조회된 KG 관계가 여기에 표시됩니다.</div>
      </div>

      <h2 style="margin-top: 24px;">📊 RDB 통계 근거</h2>
      <div id="rdbAnswer" class="rdb-box empty">조회된 RDB 통계가 여기에 표시됩니다.</div>
      <div id="rdbFacts"></div>
    </section>
  </main>

  <script>
    // config.js 에서 지정한 백엔드 주소. 없으면 같은 origin 을 사용한다.
    const API_BASE_URL = (window.API_BASE_URL || "").replace(/\/$/, "");

    // ?mock=1 이면 백엔드 대신 픽스처를 읽는다.
    const MOCK = new URLSearchParams(location.search).get("mock") === "1";

    // vis DataSet 과 Network 인스턴스는 이 전역 한 곳에만 둔다.
    const state = { network: null, nodes: null, edges: null, baseColors: {}, nodesById: {}, graph: null, filter: "전체" };

    // 라벨별 노드 색. 테두리는 배경과 같은 계열에서 한 단계 진한 색이다.
    const GROUP_COLORS = {
      Team: { background: "#f59e0b", border: "#d97706" },
      Player: { background: "#34d399", border: "#10b981" },
      Champion: { background: "#60a5fa", border: "#3b82f6" },
      Tournament: { background: "#f472b6", border: "#ec4899" },
      League: { background: "#a78bfa", border: "#8b5cf6" },
      Match: { background: "#fb7185", border: "#f43f5e" },
      Game: { background: "#cbd5e1", border: "#94a3b8" },
      Staff: { background: "#f97316", border: "#ea580c" },
      Coach: { background: "#f97316", border: "#ea580c" },
      Objective: { background: "#14b8a6", border: "#0d9488" },
      Object: { background: "#14b8a6", border: "#0d9488" },
      Entity: { background: "#9ca3af", border: "#6b7280" }
    };
    const EDGE_COLOR = "#94a3b8";
    // 흐림 처리용 색. opacity 옵션 대신 색을 치환한다.
    const DIM_NODE_COLOR = { background: "#f3f4f6", border: "#e5e7eb" };
    const DIM_EDGE_COLOR = "#e5e7eb";
    const FONT_COLOR = "#343434";
    const DIM_FONT_COLOR = "#cbd5e1";
    const RAIL_LIMIT = 12;
    const FILTER_ALL = "전체";
    const STRIP_PAD = 24;
    const SVG_NS = "http://www.w3.org/2000/svg";

    function groupColor(label) {
      return GROUP_COLORS[label] || GROUP_COLORS.Entity;
    }

    function renderGraph(graph) {
      const container = document.getElementById("graph");
      if (state.network) state.network.destroy();
      container.innerHTML = "";
      Object.assign(state, {
        network: null, nodes: null, edges: null, baseColors: {}, nodesById: {},
        graph: graph || { nodes: [], links: [] }
      });

      if (!graph || !graph.nodes || graph.nodes.length === 0) {
        container.innerHTML = "<div style='padding:20px;color:#9ca3af;'>그래프 데이터가 없습니다.</div>";
        return;
      }

      state.nodes = new vis.DataSet(
        graph.nodes.map(node => {
          const color = groupColor(node.label);
          state.nodesById[node.id] = node;
          state.baseColors[node.id] = { background: color.background, border: color.border };
          return {
            id: node.id,
            label: node.name,
            group: node.label,
            color: { background: color.background, border: color.border }
          };
        })
      );

      // 간선 id 는 필터와 강조에서 그대로 찾아 쓴다.
      state.edges = new vis.DataSet(
        (graph.links || []).map(link => ({
          id: `${link.source}|${link.target}|${link.type}`,
          from: link.source,
          to: link.target,
          label: link.type,
          arrows: "to"
        }))
      );

      const groups = {};
      Object.keys(GROUP_COLORS).forEach(label => {
        groups[label] = { color: { ...GROUP_COLORS[label] } };
      });

      const options = {
        layout: { randomSeed: 42 },
        nodes: {
          shape: "dot",
          size: 18,
          font: {
            size: 14,
            face: "Pretendard"
          },
          borderWidth: 2
        },
        edges: {
          font: {
            size: 11,
            align: "middle"
          },
          color: {
            color: EDGE_COLOR
          },
          smooth: true
        },
        groups,
        physics: {
          stabilization: { iterations: 200 }
        },
        interaction: {
          hover: true
        }
      };

      state.network = new vis.Network(container, { nodes: state.nodes, edges: state.edges }, options);
    }

    function neighborIds(nodeId) {
      const ids = new Set();
      ((state.graph && state.graph.links) || []).forEach(link => {
        if (link.source === nodeId) ids.add(link.target);
        if (link.target === nodeId) ids.add(link.source);
      });
      ids.delete(nodeId);
      return [...ids];
    }

    function focusNode(nodeId) {
      if (!state.network || !state.nodes.get(nodeId)) return;
      state.network.focus(nodeId, { scale: 1.2, animation: true });
    }

    // ids 와 그 사이 간선만 원래 색으로 두고 나머지는 회색으로 치환한다.
    function highlightNodes(ids) {
      if (!state.nodes) return;
      const keep = new Set(ids);
      state.nodes.update(state.nodes.getIds().map(id => ({
        id,
        color: keep.has(id) ? { ...state.baseColors[id] } : { ...DIM_NODE_COLOR },
        font: { color: keep.has(id) ? FONT_COLOR : DIM_FONT_COLOR }
      })));
      state.edges.update(state.edges.get().map(edge => {
        const on = keep.has(edge.from) && keep.has(edge.to);
        return {
          id: edge.id,
          color: { color: on ? EDGE_COLOR : DIM_EDGE_COLOR },
          font: { color: on ? FONT_COLOR : DIM_FONT_COLOR }
        };
      }));
    }

    function clearHighlight() {
      if (!state.nodes) return;
      state.nodes.update(state.nodes.getIds().map(id => ({
        id,
        color: { ...state.baseColors[id] },
        font: { color: FONT_COLOR }
      })));
      state.edges.update(state.edges.getIds().map(id => ({
        id,
        color: { color: EDGE_COLOR },
        font: { color: FONT_COLOR }
      })));
    }

    // 상세 카드가 붙기 전까지는 아무 일도 하지 않는다.
    async function showNodeDetail(nodeId) {}

    function renderRail(graph) {
      const rail = document.getElementById("rail");
      rail.innerHTML = "";

      const nodes = (graph && graph.nodes) || [];
      if (nodes.length === 0) {
        rail.innerHTML = '<div class="rail-empty">엔티티가 없습니다</div>';
        return;
      }

      const sorted = GraphUtils.sortNodesForRail(nodes);
      sorted.forEach((node, index) => {
        const item = document.createElement("button");
        item.type = "button";
        item.className = "rail-item";
        item.dataset.id = node.id;
        if (index >= RAIL_LIMIT) item.classList.add("hidden");

        const badge = node.is_seed === true ? '<span class="badge">핵심</span>' : "";
        item.innerHTML = `
          <span class="dot" style="background:${groupColor(node.label).background}"></span>
          <span class="rail-text">
            <span class="rail-name">${escapeHtml(node.name)}${badge}</span>
            <span class="sub">${escapeHtml(GraphUtils.railSubtitle(node))}</span>
          </span>
        `;

        item.addEventListener("mouseenter", () => highlightNodes([node.id, ...neighborIds(node.id)]));
        item.addEventListener("mouseleave", () => clearHighlight());
        item.addEventListener("click", () => {
          showNodeDetail(node.id);
          focusNode(node.id);
        });
        rail.appendChild(item);
      });

      const extra = sorted.length - RAIL_LIMIT;
      if (extra > 0) {
        const more = document.createElement("button");
        more.type = "button";
        more.className = "rail-more";
        more.innerText = `+ ${extra}개 더`;
        more.addEventListener("click", () => {
          const collapsed = more.innerText !== "접기";
          rail.querySelectorAll(".rail-item").forEach((item, index) => {
            item.classList.toggle("hidden", !collapsed && index >= RAIL_LIMIT);
          });
          more.innerText = collapsed ? "접기" : `+ ${extra}개 더`;
        });
        rail.appendChild(more);
      }
    }

    function renderFilterChips(graph) {
      const box = document.getElementById("filterChips");
      box.innerHTML = "";
      state.filter = FILTER_ALL;

      const nodes = (graph && graph.nodes) || [];
      const links = (graph && graph.links) || [];
      if (nodes.length === 0) {
        box.innerHTML = '<span class="rail-empty">관계 유형이 없습니다</span>';
        return;
      }

      const nodesById = Object.fromEntries(nodes.map(node => [node.id, node]));
      const counts = {};
      links.forEach(link => {
        const name = GraphUtils.classifyRelation(link, nodesById, GraphUtils.REL_GROUPS);
        counts[name] = (counts[name] || 0) + 1;
      });

      const chips = [{ name: FILTER_ALL, count: links.length }]
        .concat(GraphUtils.REL_GROUPS.map(group => ({ name: group.name, count: counts[group.name] || 0 })));
      chips.forEach(chip => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "chip";
        button.dataset.group = chip.name;
        button.disabled = chip.name !== FILTER_ALL && chip.count === 0;
        button.innerHTML = `${escapeHtml(chip.name)}<span class="chip-count">${chip.count}</span>`;
        button.addEventListener("click", () => applyRelationFilter(chip.name));
        box.appendChild(button);
      });
      applyRelationFilter(FILTER_ALL);
    }

    // 선택한 묶음에 속하지 않는 간선과, 보이는 간선에 닿지 않는 노드를 숨긴다.
    function applyRelationFilter(groupName) {
      state.filter = groupName;
      document.querySelectorAll("#filterChips .chip").forEach(chip => {
        chip.classList.toggle("active", chip.dataset.group === groupName);
      });
      if (!state.nodes) return;

      const visible = GraphUtils.visibleSetForGroup(state.graph, groupName, GraphUtils.REL_GROUPS);
      state.edges.update(state.edges.getIds().map(id => ({ id, hidden: !visible.linkKeys.has(id) })));
      state.nodes.update(state.nodes.getIds().map(id => ({ id, hidden: !visible.nodeIds.has(id) })));
    }

    function renderDateStrip(graph) {
      const svg = document.getElementById("dateStrip");
      const empty = document.getElementById("dateStripEmpty");
      svg.innerHTML = "";
      svg.style.display = "";
      empty.hidden = true;
      if (!graph) return;

      const width = svg.clientWidth || 600;
      const layout = GraphUtils.dateStripLayout(graph.nodes || [], width, STRIP_PAD);
      if (layout.points.length === 0) {
        svg.style.display = "none";
        empty.hidden = false;
        return;
      }

      const make = (tag, attrs) => {
        const el = document.createElementNS(SVG_NS, tag);
        Object.entries(attrs).forEach(([key, value]) => el.setAttribute(key, value));
        svg.appendChild(el);
        return el;
      };

      make("line", { x1: STRIP_PAD, y1: 20, x2: width - STRIP_PAD, y2: 20, stroke: "#e5e7eb", "stroke-width": 2 });
      layout.points.forEach(point => {
        const circle = make("circle", {
          cx: point.x, cy: 20, r: 5, "data-id": point.id,
          fill: GROUP_COLORS.Match.background, stroke: GROUP_COLORS.Match.border
        });
        const title = document.createElementNS(SVG_NS, "title");
        title.textContent = point.date;
        circle.appendChild(title);
        circle.addEventListener("click", () => {
          if (state.network && state.nodes.get(point.id)) {
            state.network.focus(point.id, { scale: 1.2, animation: true });
            state.network.selectNodes([point.id]);
          }
          showNodeDetail(point.id);
        });
      });
      make("text", { x: STRIP_PAD, y: 46, "text-anchor": "start" }).textContent = layout.minLabel;
      make("text", { x: width - STRIP_PAD, y: 46, "text-anchor": "end" }).textContent = layout.maxLabel;
    }

    window.addEventListener("resize", () => renderDateStrip(state.graph));

    function renderStats(data) {
      const stats = GraphUtils.computeStats(data);
      document.getElementById("statSeeds").innerText = stats.seeds.slice(0, 3).join(", ") || "-";
      document.getElementById("statMatches").innerText = `경기 ${stats.matchCount} · 관계 ${stats.linkCount}`;
      document.getElementById("statPeriod").innerText = stats.period;
      document.getElementById("statArticles").innerText = stats.articleCount;
    }

    async function loadAsk(question) {
      if (MOCK) {
        const response = await fetch("fixtures/ask_sample.json");
        if (!response.ok) throw new Error(`픽스처 로드 실패: ${response.status}`);
        return response.json();
      }

      const response = await fetch(`${API_BASE_URL}/ask`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ question })
      });
      if (!response.ok) throw new Error(`/ask 요청 실패: ${response.status}`);
      return response.json();
    }

  function renderRdb(data) {
    const rdbAnswer = document.getElementById("rdbAnswer");
    const rdbFacts = document.getElementById("rdbFacts");
    rdbFacts.innerHTML = "";

    const answer = (data.rdb_answer || "").trim();
    const facts = data.rdb_facts || [];
    const entities = data.rdb_entities || { players: [], teams: [] };
    const sql = data.rdb_sql;

    // 답변도 통계 사실도 없으면 근거 없음 처리
    if (!answer && facts.length === 0) {
      rdbAnswer.className = "rdb-box empty";
      rdbAnswer.innerText = "이 질문에서는 RDB 통계 근거를 찾지 못했습니다.";
      return;
    }

    rdbAnswer.className = "rdb-box";
    rdbAnswer.innerText = answer || "RDB 통계 답변이 없습니다.";

    // 별칭 해소로 확인된 선수/팀
    const ents = [...(entities.players || []), ...(entities.teams || [])];
    if (ents.length > 0) {
      const div = document.createElement("div");
      div.className = "rdb-card";
      div.innerHTML = `<strong>확인된 엔티티</strong><br>${escapeHtml(ents.join(", "))}`;
      rdbFacts.appendChild(div);
    }

    // 정형 통계 사실 목록
    facts.forEach((fact) => {
      const div = document.createElement("div");
      div.className = "rdb-card";
      div.innerText = fact;
      rdbFacts.appendChild(div);
    });

    // Text-to-SQL 폴백으로 실행된 SQL (있을 때만)
    if (sql) {
      const div = document.createElement("div");
      div.className = "sql-box";
      div.innerText = "-- Text-to-SQL\n" + sql;
      rdbFacts.appendChild(div);
    }
  }

    function setQuestion(text) {
      document.getElementById("question").value = text;
    }

    async function askQuestion() {
      const question = document.getElementById("question").value.trim();

      if (!question) {
        alert("질문을 입력해주세요.");
        return;
      }

      const answerDiv = document.getElementById("answer");
      const chunksDiv = document.getElementById("chunks");
      const queryStatus = document.getElementById("queryStatus");
      const apiStatus = document.getElementById("apiStatus");

      answerDiv.className = "answer-box loading";
      answerDiv.innerText = "AI가 지식그래프 관계를 바탕으로 답변을 생성 중입니다...";

      chunksDiv.innerHTML = "";

      const rdbAnswerDiv = document.getElementById("rdbAnswer");
      rdbAnswerDiv.className = "rdb-box loading";
      rdbAnswerDiv.innerText = "RDB 통계를 조회 중입니다...";
      document.getElementById("rdbFacts").innerHTML = "";

      queryStatus.innerText = "분석 중...";
      apiStatus.innerText = MOCK ? "목 픽스처 로드 중" : "API 요청 중";

      try {
        const data = await loadAsk(question);
        console.log("ASK RESPONSE:", data);
        console.log("GRAPH DATA:", data.graph);

        answerDiv.className = "answer-box";
        answerDiv.innerText = data.answer || "답변을 생성하지 못했습니다.";
        renderStats(data);
        renderGraph(data.graph);
        renderRail(data.graph);
        renderFilterChips(data.graph);
        renderDateStrip(data.graph);
        renderRdb(data);

        chunksDiv.innerHTML = "";

        const chunks = data.related_chunks || [];

        if (chunks.length === 0) {
          chunksDiv.innerHTML = '<div class="chunk-card empty">조회된 KG 관계가 없습니다.</div>';
        } else {
          chunks.forEach((chunk, index) => {
            const div = document.createElement("div");
            div.className = "chunk-card";
            div.innerHTML = `
              <h4>KG 관계 ${index + 1}</h4>
              <p>${escapeHtml(chunk.slice(0, 320))}</p>
            `;
            chunksDiv.appendChild(div);
          });
        }

        queryStatus.innerText = `질문 분석 완료: ${question}`;
        apiStatus.innerText = MOCK ? "목 모드 (픽스처)" : "API 연결 완료";
      } catch (error) {
        answerDiv.className = "answer-box";
        answerDiv.innerText = "오류가 발생했습니다. FastAPI 서버가 실행 중인지 확인해주세요.";
        rdbAnswerDiv.className = "rdb-box empty";
        rdbAnswerDiv.innerText = "RDB 통계를 불러오지 못했습니다.";
        queryStatus.innerText = "오류 발생";
        apiStatus.innerText = "API 오류";
        console.error(error);
      }
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.innerText = text;
      return div.innerHTML;
    }
  </script>
