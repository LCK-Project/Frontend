<!DOCTYPE html>
<html lang="ko">
<head>
<script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
  <script src="config.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LCK Knowledge Graph Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: "Pretendard", "Noto Sans KR", Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f6f7fb;
      color: #222;
    }

    header {
      padding: 22px 36px;
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 800;
    }

    header span {
      color: #6b7280;
      font-size: 14px;
    }

    .container {
      display: grid;
      grid-template-columns: 320px 1fr 380px;
      gap: 20px;
      padding: 24px;
      height: calc(100vh - 82px);
    }

    .panel {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04);
      overflow: auto;
    }

    .panel h2 {
      margin-top: 0;
      font-size: 18px;
      margin-bottom: 16px;
    }

    textarea {
      width: 100%;
      height: 110px;
      resize: none;
      border: 1px solid #d1d5db;
      border-radius: 14px;
      padding: 14px;
      font-size: 14px;
      outline: none;
    }

    textarea:focus {
      border-color: #f59e0b;
      box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.18);
    }

    button {
      border: none;
      cursor: pointer;
      border-radius: 12px;
      font-weight: 700;
      transition: 0.2s;
    }

    .ask-btn {
      width: 100%;
      margin-top: 12px;
      padding: 14px;
      background: #f59e0b;
      color: white;
      font-size: 15px;
    }

    .ask-btn:hover {
      background: #d97706;
    }

    .suggestions {
      margin-top: 22px;
    }

    .suggestions button {
      width: 100%;
      text-align: left;
      padding: 12px;
      margin-bottom: 10px;
      background: #fff7ed;
      color: #92400e;
      border: 1px solid #fed7aa;
    }

    .suggestions button:hover {
      background: #ffedd5;
    }

    .filters {
      margin-top: 24px;
    }

    select {
      width: 100%;
      padding: 11px;
      border-radius: 12px;
      border: 1px solid #d1d5db;
      margin-bottom: 10px;
      background: white;
    }

    .main-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .status {
      font-size: 13px;
      color: #6b7280;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 18px;
    }

    .stat-card {
      background: #fff7ed;
      border: 1px solid #fed7aa;
      border-radius: 14px;
      padding: 16px;
    }

    .stat-card .label {
      color: #92400e;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .stat-card .value {
      font-size: 24px;
      font-weight: 800;
      color: #111827;
    }

    .graph-box {
    height: 430px;
    border-radius: 18px;
    background: #ffffff;
    border: 1px solid #e5e7eb;
    overflow: hidden;
    }

   

    .legend {
      margin-top: 14px;
      display: flex;
      gap: 12px;
      font-size: 13px;
      color: #6b7280;
      flex-wrap: wrap;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 5px;
    }

    .answer-box {
      background: #fff7ed;
      border: 1px solid #fed7aa;
      border-radius: 16px;
      padding: 16px;
      line-height: 1.7;
      white-space: pre-wrap;
      min-height: 220px;
    }

    .chunk-card {
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 14px;
      margin-top: 12px;
      background: #fafafa;
      line-height: 1.6;
      font-size: 14px;
    }

    .chunk-card h4 {
      margin: 0 0 8px 0;
      color: #92400e;
    }

    .rdb-box {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 16px;
      padding: 16px;
      line-height: 1.7;
      white-space: pre-wrap;
      font-size: 14px;
    }

    .rdb-card {
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 10px 12px;
      margin-top: 10px;
      background: #f8fafc;
      font-size: 13px;
      line-height: 1.55;
    }

    .rdb-card strong {
      color: #1d4ed8;
    }

    .sql-box {
      margin-top: 12px;
      background: #0f172a;
      color: #e2e8f0;
      border-radius: 12px;
      padding: 12px;
      font-family: "Consolas", "Courier New", monospace;
      font-size: 12.5px;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .loading {
      color: #d97706;
      font-weight: 700;
    }

    .empty {
      color: #9ca3af;
    }

    @media (max-width: 1100px) {
      .container {
        grid-template-columns: 1fr;
        height: auto;
      }

      .stats {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>

<body>
  <header>
    <div>
      <h1>🎮 LCK Knowledge Graph Dashboard</h1>
      <span>Neo4j 지식그래프 기반 LCK 질의응답 시스템</span>
    </div>
    <span id="apiStatus">API 연결 대기</span>
  </header>

  <main class="container">
    <!-- 왼쪽 입력 패널 -->
    <section class="panel">
      <h2>자연어 질의</h2>

      <textarea id="question" placeholder="예: 젠지 우승 전략을 알려줘"></textarea>
      <button class="ask-btn" onclick="askQuestion()">질문하기</button>

      <div class="suggestions">
        <h2>추천 질문</h2>
        <button onclick="setQuestion('젠지 우승 전략을 알려줘')">젠지 우승 전략을 알려줘</button>
        <button onclick="setQuestion('페이커가 사용한 챔피언을 알려줘')">페이커가 사용한 챔피언을 알려줘</button>
        <button onclick="setQuestion('T1과 Gen.G의 관계를 알려줘')">T1과 Gen.G의 관계를 알려줘</button>
        <button onclick="setQuestion('2025 스프링 MVP 관련 내용을 알려줘')">2025 스프링 MVP 관련 내용을 알려줘</button>
      </div>

      <div class="filters">
        <h2>필터</h2>
        <select>
          <option>전체 기간</option>
          <option>2025</option>
          <option>2024</option>
        </select>

        <select>
          <option>전체 팀</option>
          <option>Gen.G</option>
          <option>T1</option>
          <option>HLE</option>
          <option>KT</option>
        </select>

        <select>
          <option>전체 분석 유형</option>
          <option>팀 분석</option>
          <option>선수 분석</option>
          <option>경기 분석</option>
          <option>대회 분석</option>
        </select>
      </div>
    </section>

    <!-- 가운데 대시보드 패널 -->
    <section class="panel">
      <div class="main-title">
        <h2>지식그래프 시각화</h2>
        <span class="status" id="queryStatus">질문을 입력하면 분석이 시작됩니다.</span>
      </div>

      <div class="stats">
        <div class="stat-card">
          <div class="label">KG 근거</div>
          <div class="value" id="chunkCount">0</div>
        </div>
        <div class="stat-card">
          <div class="label">분석 상태</div>
          <div class="value" id="analysisState">대기</div>
        </div>
        <div class="stat-card">
          <div class="label">데이터 소스</div>
          <div class="value">KG+RDB</div>
        </div>
        <div class="stat-card">
          <div class="label">그래프 저장소</div>
          <div class="value">Neo4j</div>
        </div>
      </div>

    <div id="graph" class="graph-box"></div>
    </section>

    <!-- 오른쪽 답변 패널 -->
    <section class="panel">
      <h2>AI 답변 결과</h2>

      <div id="answer" class="answer-box empty">
        아직 질문이 입력되지 않았습니다.
      </div>

      <h2 style="margin-top: 24px;">지식그래프 근거</h2>
      <div id="chunks">
        <div class="chunk-card empty">조회된 KG 관계가 여기에 표시됩니다.</div>
      </div>

      <h2 style="margin-top: 24px;">📊 RDB 통계 근거</h2>
      <div id="rdbAnswer" class="rdb-box empty">조회된 RDB 통계가 여기에 표시됩니다.</div>
      <div id="rdbFacts"></div>
    </section>
  </main>

  <script>
    // config.js 에서 지정한 백엔드 주소. 없으면 같은 origin 을 사용한다.
    const API_BASE_URL = (window.API_BASE_URL || "").replace(/\/$/, "");

  function renderGraph(graphData) {
  const container = document.getElementById("graph");
  container.innerHTML = "";

  if (!graphData || !graphData.nodes || graphData.nodes.length === 0) {
    container.innerHTML = "<div style='padding:20px;color:#9ca3af;'>그래프 데이터가 없습니다.</div>";
    return;
  }

  const nodes = new vis.DataSet(
    graphData.nodes.map(node => ({
      id: node.id,
      label: node.name,
      group: node.label
    }))
  );

  const edges = new vis.DataSet(
    graphData.links.map(link => ({
      from: link.source,
      to: link.target,
      label: link.type,
      arrows: "to"
    }))
  );

  const data = { nodes, edges };

  const options = {
    nodes: {
      shape: "dot",
      size: 18,
      font: {
        size: 14,
        face: "Pretendard"
      },
      borderWidth: 2
    },
    edges: {
      font: {
        size: 11,
        align: "middle"
      },
      color: {
        color: "#94a3b8"
      },
      smooth: true
    },
    groups: {
      Team: {
        color: { background: "#f59e0b", border: "#d97706" }
      },
      Player: {
        color: { background: "#34d399", border: "#10b981" }
      },
      Champion: {
        color: { background: "#60a5fa", border: "#3b82f6" }
      },
      Tournament: {
        color: { background: "#f472b6", border: "#ec4899" }
      },
      League: {
        color: { background: "#a78bfa", border: "#8b5cf6" }
      }
    },
    physics: {
      stabilization: true
    },
    interaction: {
      hover: true
    }
  };

  new vis.Network(container, data, options);
}
  function renderRdb(data) {
    const rdbAnswer = document.getElementById("rdbAnswer");
    const rdbFacts = document.getElementById("rdbFacts");
    rdbFacts.innerHTML = "";

    const answer = (data.rdb_answer || "").trim();
    const facts = data.rdb_facts || [];
    const entities = data.rdb_entities || { players: [], teams: [] };
    const sql = data.rdb_sql;

    // 답변도 통계 사실도 없으면 근거 없음 처리
    if (!answer && facts.length === 0) {
      rdbAnswer.className = "rdb-box empty";
      rdbAnswer.innerText = "이 질문에서는 RDB 통계 근거를 찾지 못했습니다.";
      return;
    }

    rdbAnswer.className = "rdb-box";
    rdbAnswer.innerText = answer || "RDB 통계 답변이 없습니다.";

    // 별칭 해소로 확인된 선수/팀
    const ents = [...(entities.players || []), ...(entities.teams || [])];
    if (ents.length > 0) {
      const div = document.createElement("div");
      div.className = "rdb-card";
      div.innerHTML = `<strong>확인된 엔티티</strong><br>${escapeHtml(ents.join(", "))}`;
      rdbFacts.appendChild(div);
    }

    // 정형 통계 사실 목록
    facts.forEach((fact) => {
      const div = document.createElement("div");
      div.className = "rdb-card";
      div.innerText = fact;
      rdbFacts.appendChild(div);
    });

    // Text-to-SQL 폴백으로 실행된 SQL (있을 때만)
    if (sql) {
      const div = document.createElement("div");
      div.className = "sql-box";
      div.innerText = "-- Text-to-SQL\n" + sql;
      rdbFacts.appendChild(div);
    }
  }

    function setQuestion(text) {
      document.getElementById("question").value = text;
    }

    async function askQuestion() {
      const question = document.getElementById("question").value.trim();

      if (!question) {
        alert("질문을 입력해주세요.");
        return;
      }

      const answerDiv = document.getElementById("answer");
      const chunksDiv = document.getElementById("chunks");
      const queryStatus = document.getElementById("queryStatus");
      const apiStatus = document.getElementById("apiStatus");

      answerDiv.className = "answer-box loading";
      answerDiv.innerText = "AI가 지식그래프 관계를 바탕으로 답변을 생성 중입니다...";

      chunksDiv.innerHTML = "";

      const rdbAnswerDiv = document.getElementById("rdbAnswer");
      rdbAnswerDiv.className = "rdb-box loading";
      rdbAnswerDiv.innerText = "RDB 통계를 조회 중입니다...";
      document.getElementById("rdbFacts").innerHTML = "";

      queryStatus.innerText = "분석 중...";
      apiStatus.innerText = "API 요청 중";

      document.getElementById("analysisState").innerText = "분석중";

      try {
        const response = await fetch(`${API_BASE_URL}/ask`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ question })
        });

        const data = await response.json();
        console.log("ASK RESPONSE:", data);
        console.log("GRAPH DATA:", data.graph);

        answerDiv.className = "answer-box";
        answerDiv.innerText = data.answer || "답변을 생성하지 못했습니다.";
        renderGraph(data.graph);
        renderRdb(data);

        chunksDiv.innerHTML = "";

        const chunks = data.related_chunks || [];
        document.getElementById("chunkCount").innerText = chunks.length;
        document.getElementById("analysisState").innerText = "완료";

        if (chunks.length === 0) {
          chunksDiv.innerHTML = '<div class="chunk-card empty">조회된 KG 관계가 없습니다.</div>';
        } else {
          chunks.forEach((chunk, index) => {
            const div = document.createElement("div");
            div.className = "chunk-card";
            div.innerHTML = `
              <h4>KG 관계 ${index + 1}</h4>
              <p>${escapeHtml(chunk.slice(0, 320))}</p>
            `;
            chunksDiv.appendChild(div);
          });
        }

        queryStatus.innerText = `질문 분석 완료: ${question}`;
        apiStatus.innerText = "API 연결 완료";
      } catch (error) {
        answerDiv.className = "answer-box";
        answerDiv.innerText = "오류가 발생했습니다. FastAPI 서버가 실행 중인지 확인해주세요.";
        rdbAnswerDiv.className = "rdb-box empty";
        rdbAnswerDiv.innerText = "RDB 통계를 불러오지 못했습니다.";
        queryStatus.innerText = "오류 발생";
        apiStatus.innerText = "API 오류";
        document.getElementById("analysisState").innerText = "오류";
        console.error(error);
      }
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.innerText = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
